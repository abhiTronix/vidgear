version: 2.1

orbs:
  win: circleci/windows@5.1.1
  codecov: codecov/codecov@6.1.0

parameters:
  run-tests:
    type: boolean
    default: false

jobs:
  test-windows:
    parameters:
      python-package:
        type: string
    executor:
      name: win/default
    steps:
      - checkout

      # Install specific Python version on CircleCI Windows VM via Chocolatey
      - run:
          name: Install << parameters.python-package >>
          command: |
            choco install << parameters.python-package >> -y --no-progress
            refreshenv

      # Restore only download caches (do NOT cache .venv on Windows)
      - restore_cache:
          keys:
            - poetry-cache-v2-<< parameters.python-package >>-{{ checksum "poetry.lock" }}

      # Install Poetry, configure in-project venv, and install dependencies
      - run:
          name: Install Dependencies with Poetry
          command: |
            python --version
            python -m pip install --upgrade pip poetry
            poetry config virtualenvs.in-project true
            poetry env use (Get-Command python).Source
            poetry run pip install six httpx2 numpy cython opencv-python
            poetry install --all-extras --no-interaction
            poetry run pip install --no-deps https://github.com/abhiTronix/python-mpegdash/releases/download/0.3.0-dev2/mpegdash-0.3.0.dev2-py3-none-any.whl
            poetry run pip install pytest codecov pytest-cov pytest-asyncio m3u8 async-asgi-testclient paramiko

      # Save only pip and Poetry download caches
      - save_cache:
          key: poetry-cache-v2-<< parameters.python-package >>-{{ checksum "poetry.lock" }}
          paths:
            - C:\Users\circleci\AppData\Local\pip\Cache
            - C:\Users\circleci\AppData\Local\pypoetry\Cache

      # Run bash script using Git Bash
      - run:
          name: Prepare Dataset
          shell: bash.exe
          command: |
            chmod +x scripts/bash/prepare_dataset.sh
            bash scripts/bash/prepare_dataset.sh

      # Execute Pytest inside Poetry's virtual environment
      - run:
          name: Run Tests
          command: |
            poetry run pytest --verbose --capture=no --cov-report term-missing --cov=vidgear vidgear/tests/

      # Upload Coverage via Codecov Orb
      - codecov/upload

workflows:
  windows-test-matrix:
    when: << pipeline.parameters.run-tests >>
    jobs:
      - test-windows:
          name: << matrix.python-package >>
          matrix:
            parameters:
              python-package: ["python311", "python312", "python313", "python314"]