version: 2.1

setup: true

orbs:
  path-filtering: circleci/path-filtering@3.0.0

workflows:
  setup-workflow:
    jobs:
      # Matches: on: push: branches: [testing]
      - path-filtering/filter:
          name: filter-push-testing
          base-revision: testing
          config-path: .circleci/continue_config.yml
          exclude: |
            .*\.md
            .*\.html
            .*\.js
            .*\.css
            docs/.*
            mkdocs\.yml
            README\.md
          mapping: |
            .* run-tests true
          filters: pipeline.event.name == "push" and pipeline.git.branch == "testing"

      # Matches: on: pull_request: branches: [testing]
      - path-filtering/filter:
          name: filter-pr-testing
          base-revision: testing
          config-path: .circleci/continue_config.yml
          exclude: |
            .*\.md
            docs/.*
          mapping: |
            .* run-tests true
          filters: pipeline.event.name == "pull_request"