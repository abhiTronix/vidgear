name: Run Windows CI-Tests for vidgear

on:
  push:
    branches:
      - testing
    paths-ignore:
      - "**/*.md"
      - "**/*.html"
      - "**/*.js"
      - "**/*.css"
      - "docs/**/*"
      - README.md
      - mkdocs.yml
  pull_request:
    branches:
      - testing
    paths-ignore:
      - "**/*.md"
      - "docs/**/*"

jobs:
  test:
    name: Windows CI Test vidgear
    runs-on: blacksmith-2vcpu-windows-2025
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: install pip_dependencies
        run: |
          python -m pip install --upgrade pip wheel numpy cython opencv-python
          python -m pip install --upgrade ".[asyncio]" six httpx2 "yt-dlp[default]" aiortc
          python -m pip install --upgrade pytest codecov pytest-cov pytest-asyncio m3u8 async-asgi-testclient paramiko
          python -m pip install --upgrade deffcode
          python -m pip install https://github.com/abhiTronix/python-mpegdash/releases/download/0.3.0-dev2/mpegdash-0.3.0.dev2-py3-none-any.whl
        if: success()
      - name: run prepare_dataset_script
        run: bash scripts/bash/prepare_dataset.sh
        shell: bash
      - name: Run pytest tests
        run: python -m pytest --verbose --capture=no --cov-report term-missing --cov=vidgear vidgear/tests/
      - name: Upload coverage to Codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: python -m codecov
        if: success()