[[package]]
name = "yt-dlp"
version = "2026.10.26"
description = "A feature-rich command-line audio/video downloader"
optional = true
python-versions = ">=3.11"
groups = ["main"]
markers = "extra == \"core\" or extra == \"asyncio\""
files = [
    {file = "yt_dlp-2026.10.26-py3-none-any.whl", hash = "sha256:a05c5b5d8562f7e8a62f5334348b406af4930d56d3a65f8021d14af0e22339ae"},
    {file = "yt_dlp-2026.10.26.tar.gz", hash = "sha256:abe5c6b94c3b2f0560500add1c42e0a97641752743a5b65588ac2007a6e23eb6"},
]

[package.dependencies]
brotli = {version = "*", optional = true, markers = "implementation_name == \"cpython\" and sys_platform != \"ios\" and extra == \"default\""}
brotlicffi = {version = "*", optional = true, markers = "implementation_name != \"cpython\" and extra == \"default\""}
certifi = {version = ">=2026.10.19", optional = true, markers = "extra == \"default\""}
mutagen = {version = "*", optional = true, markers = "extra == \"default\""}
pycryptodomex = {version = "*", optional = true, markers = "extra == \"default\""}
requests = {version = ">=2.32.2,<3", optional = true, markers = "extra == \"default\""}
urllib3 = {version = ">=2.0.2,<3", optional = true, markers = "extra == \"default\""}
websockets = {version = ">=13.0", optional = true, markers = "extra == \"default\""}
yt-dlp-ejs = {version = "0.8.0", optional = true, markers = "extra == \"default\""}

[package.extras]
curl-cffi = ["curl-cffi (>=0.5.10,<0.6 || >=0.10.dev0,<0.18) ; implementation_name == \"cpython\""]
default = ["brotli ; implementation_name == \"cpython\" and sys_platform != \"ios\"", "brotlicffi ; implementation_name != \"cpython\"", "certifi (>=2026.10.19)", "mutagen", "pycryptodomex", "requests (>=2.32.2,<3)", "urllib3 (>=2.0.2,<3)", "websockets (>=13.0)", "yt-dlp-ejs (==0.8.0)"]
